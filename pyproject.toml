[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adventure-cli-rpg"
version = "1.0.0"
description = "A polished text-based RPG demonstrating Python OOP, persistence, testing, and modular design."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nazariy Martynyuk" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["core*", "models*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
